image: python:3.3

before_script:
  - pip3 install ply
  - export PYTHONPATH=$PWD:$PYTHONPATH

stages:
  - test

job1:
  stage: test
  script:
    - python3 -m pyroff.pyroff.pyeqn
    - python3 -m pyroff.pyroff.eqn2latex
    - python3 -m pyroff.pyroff.pytbl
    - python3 -m pyroff.pyroff.tbl2html
    - python3 -m pyroff.pyroff.ast
    - python3 -m pyroff.pyroff.eqn
    - python3 -m pyroff.pyroff.tbllexer
    - python3 -m pyroff.pyroff.pypic
  only:
    - master
  tags:
    - docker
