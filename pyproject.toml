[project]
name = "pyroff"
version = "0.1.0"
description = "eqn/tbl/pic transpilers to LaTeX/HTML/SVG, plus the eqnonline live demo"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ply>=3.11",
    "aiohttp>=3.11",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "marimo>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyroff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
