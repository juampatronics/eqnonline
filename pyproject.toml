[project]
name = "pyroff"
version = "0.1.0"
author = [
  { name = "Juan Pablo de la Cruz Gutiérrez ", email = "juampatronics@gmail.com" },
]
description = "eqn/tbl/pic transpilers to LaTeX/HTML/SVG, plus the eqnonline live demo"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["ply>=3.11", "aiohttp>=3.11"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Compilers",
  "Environment :: WebAssembly",
  "Framework :: Pyodide",
]

[dependency-groups]
dev = ["pytest>=7.0", "marimo>=0.17.6"]

[tool.hatch.build]
# pyroff/parsetab.py is gitignored (generated artifact) but must ship in the wheel
ignore-vcs = true
exclude = ["pyroff/parser.out"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyroff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://juampatronics.com/eqn"
Repository = "https://github.com/juampatronics/eqnonline"
